name: Deploy ADF to Production

on:
  workflow_dispatch:  
  
  push:
    branches:
      - adf_publish

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: Production

    steps:
      - name: Checkout adf_publish
        uses: actions/checkout@v4
        with:
          ref: adf_publish

      - name: Checkout main
        uses: actions/checkout@v4
        with:
          path: main
      
      - name: Verify Files
        run: |
          ls -R
          ls -la main/deployment

      - name: Show Parameter File
        run: |
          cat main/deployment/prod.parameters.json

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}

      - name: Deploy ADF ARM Template
        uses: azure/arm-deploy@v2
        with:
          scope: resourcegroup
          resourceGroupName: rg_testdeploymenttoprod
          template: ./factoryondatafactory/ARMTemplateForFactory.json
          parameters: "@main/deployment/prod.parameters.json"
